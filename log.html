<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <forms>
        <div class="container">
            <div class="contain">
                <label for="username">Full Name</label>
                <input type="text"placeholder="Your Name"required>
                <label for="email">email</label>
                <input type="email"placeholder=nino@gmail.com required>
                <label for="password">password</label>
                <input type="password"placeholder=------>
                <button type="submit">log in </button>
            </div>
        </div>
    </forms>
    <style>
        body{
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            padding: 35px;
            background-color: rgb(233, 28, 45);
            width: 200px;
            margin: 30px;
            display: flex;
            justify-content: center;
            border-radius: 20px;
        }
        .contain{
          background:orange ;
          border: 1px solid #eee;
          border-radius: 10px;
          padding: 30px;
         width: 100%;
         box-shadow: 0 4px 6px rgb(0,0,0.1);
        }
        label{
            font-size: 20px;
           font-family: 'Times New Roman', Times, serif;
           font-weight: 800;
           color: red;
        }
        input{
            width: 100%;
            padding: 8px;
            border: 1px solid rgb(233, 28, 45);
            border-radius: 8px;
        }
        button{
            width: 100%;
            padding: 8px;
            background: rgb(233,28,45);
            border: none;
            margin-top: 20px;
            border-radius: 10px;
            color: orange;
        }
        button:hover{
            background: orange;
            color: red;

        }
    </style>
</body>
</html>
