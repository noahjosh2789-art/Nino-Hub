<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <forms>
        <div class="container">
            <div class="contain">
                <label for="username">Full Name</label>
                <input type="text"placeholder="Your Name"required>
                <label for="email">email</label>
                <input type="email"placeholder=nino@gmail.com required>
                <label for="password">password</label>
                <input type="password"placeholder=------>
               <label for="confirm password">confirm password</label>
                <input type="password"placeholder=------ required>
                <button type="submit">log in </button>
            </div>
        </div>
    </forms>
</body>
 <style>
        body{
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            padding: 35px;
            background-color: rgb(59, 190, 81);
            width: 200px;
            margin: 30px;
            display: flex;
            justify-content: center;
            border-radius: 20px;
        }
         .contain{
          background:rgb(56, 54, 184) ;
          border: 1px solid #eee;
          border-radius: 10px;
          padding: 30px;
         width: 100%;
         box-shadow: 0 4px 6px rgb(66, 11, 11);
        }
        label{
            font-size: 20px;
           font-family: 'Times New Roman', Times, serif;
           font-weight: 900;
           color: rgb(59, 190, 81);
        }
         input{
            width: 100%;
            padding: 8px;
            border: 1px solid rgb(59, 190, 81);
            border-radius: 8px;
        }
         button{
            width: 100%;
            padding: 8px;
            background: rgb(59, 190, 81);
            border-radius: 8px;;
            border: none;
            margin-top: 20px;
            border-radius: 10px;
            color: rgb(56, 54, 184);
        }
         button:hover{
            background: rgb(56, 54, 184);
            color:rgb(59, 190, 81);
         }
          </style>
</body>
</html>
